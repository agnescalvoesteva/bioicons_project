name: bioicons-flux
channels:
  - conda-forge
  - pytorch
dependencies:
  # Python base
  - python=3.10
  - pip

  # Core scientific stack
  - numpy=1.26
  - pillow
  - cairosvg
  - freetype
  - libpng

  # Hugging Face + datasets
  - pytorch>=2.2
  - torchvision
  - sentencepiece
  - pip:
      - datasets==3.1.0
      - huggingface_hub>=0.23.0
      - accelerate==0.31.0
      - diffusers>=0.30.0
      - transformers>=4.41.2
      - peft==0.11.1
      - smart_open~=6.4.0

      # Utils
      - ftfy~=6.1.0
      - pydantic==2.9.2
      - wandb==0.17.6

      # Image + SVG handling
      - cairosvg
